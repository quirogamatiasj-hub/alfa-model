      <a class="logo" href="index.html">Tecno<span>Tienda</span></a>

  <main>
    <section class="contenedor pagina">
      <p class="etiqueta">OPINIONES</p>
      <h1>Comentarios de clientes</h1>
      <form id="form-comentario" class="formulario">
        <label>Tu nombre<input id="com-nombre" type="text" maxlength="40" required></label>
        <label>Calificación
          <select id="com-estrellas">
            <option value="5">★★★★★ - Excelente</option>
            <option value="4">★★★★ - Muy bueno</option>
            <option value="3">★★★ - Bueno</option>
            <option value="2">★★ - Regular</option>
            <option value="1">★ - Puede mejorar</option>
          </select>
        </label>
        <label>Comentario<textarea id="com-texto" rows="4" maxlength="500" required></textarea></label>
        <button class="boton" type="submit">Publicar comentario</button>
      </form>
      <p id="comentario-mensaje" class="mensaje" role="status"></p>
      <div id="lista-comentarios" class="lista"></div>
    </section>
  </main>
